global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'portal-inapp-webhook'

receivers:
  - name: 'portal-inapp-webhook'
    webhook_configs:
      - url: 'http://192.168.10.208:3000/api/alerts'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # Token lives in a root-only file mounted into the container (see docker-compose.yml);
            # it must match the token the portal BFF expects on POST /api/alerts.
            credentials_file: /etc/alertmanager/webhook_token

