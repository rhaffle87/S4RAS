services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.6
    container_name: jellyfin
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media
      - ./branding/favicon.ico:/jellyfin/jellyfin-web/favicon.ico:ro
      - ./branding/favicon.png:/jellyfin/jellyfin-web/favicon.png:ro
      - ./branding/favicon.svg:/jellyfin/jellyfin-web/favicon.svg:ro
      - ./branding/touchicon.png:/jellyfin/jellyfin-web/touchicon.png:ro
      - ./branding/touchicon512.png:/jellyfin/jellyfin-web/touchicon512.png:ro
      - ./branding/icon-transparent.png:/jellyfin/jellyfin-web/icon-transparent.png:ro
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.31.0
    container_name: dispatcharr
    restart: unless-stopped
    ports:
      - "9191:9191"
    volumes:
      - ./dispatcharr_data:/data
      - ./media:/media:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9191 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  jellyseerr:
    image: fallenbagel/jellyseerr:2.3.0
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - "5055:5055"
    volumes:
      - ./jellyseerr_config:/app/config
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
