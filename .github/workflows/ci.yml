name: S4RAS Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, and Build Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix portal-saras install --no-save @rolldown/binding-linux-x64-gnu@1.0.3

      - name: Run lint
        run: npm run portal:lint

      - name: Run unit tests
        run: npm run portal:test

      - name: Build frontend distribution
        run: npm run build

  deploy-status:
    name: Production Deployment Status Check
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Automated Self-Hosted Pipeline
        run: |
          echo "Production deployment is executed via dedicated self-hosted workflow 'deploy-self-hosted.yml' running on VM 208 runner (vm208-portal)."
          echo "Validation completed. Automated CD running on self-hosted runner." 

