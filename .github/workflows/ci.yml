name: S4RAS Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, and Build Portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix portal-saras install --no-save @rolldown/binding-linux-x64-gnu@1.0.3

      - name: Run lint
        run: npm run portal:lint

      - name: Run unit tests
        run: npm run portal:test

      - name: Build frontend distribution
        run: npm run build

  deploy:
    name: Continuous Deployment (Production VM 208)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger S4RAS Webhook Deployment
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::notice::DEPLOY_TOKEN secret is not configured. Skipping production deployment."
            exit 0
          fi
          echo "Triggering deployment webhook on VM 208..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://portal.s4ras.site/api/deploy \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: $DEPLOY_TOKEN" \
            -d '{"triggeredBy":"github-actions-ci"}' || true)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Deployment webhook triggered successfully on VM 208."
          else
            echo "::notice::Deploy webhook returned HTTP $HTTP_CODE (Cloudflare WAF / Managed Challenge active for runner IP). Use manual sync on VM 208 or configure Cloudflare WAF skip rule for /api/deploy."
          fi

