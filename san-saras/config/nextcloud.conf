# ==============================================================================
# S4RAS Nextcloud SAN — Host Nginx Virtual Host Configuration
# Location on VM 207: /etc/nginx/sites-available/nextcloud.conf
# Enable: sudo ln -sf /etc/nginx/sites-available/nextcloud.conf /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cloud.s4ras.site 192.168.10.207 100.64.0.17;

    # Kapasitas payload file unggahan besar (hingga 10 GB)
    client_max_body_size 10G;
    client_body_timeout 300s;
    client_header_timeout 300s;

    # Buffer dan timeout reverse proxy
    proxy_connect_timeout 90s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffers 64 4k;

    # Log akses dan kesalahan
    access_log /var/log/nginx/nextcloud_access.log;
    error_log  /var/log/nginx/nextcloud_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Mendukung Websocket untuk notifikasi dan dokumen realtime
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Menonaktifkan buffering disk untuk transfer stream langsung
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Redirect well-known endpoints untuk sinkronisasi kalender dan kontak (CalDAV/CardDAV)
    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/webfinger {
        return 301 $scheme://$host/index.php/.well-known/webfinger;
    }
    location = /.well-known/nodeinfo {
        return 301 $scheme://$host/index.php/.well-known/nodeinfo;
    }
}
