services:
  cache:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis_data:/data
    # maxmemory and eviction policy persisted here (RD-01 fix - survives container recreates)
    command:
      - "redis-server"
      - "--protected-mode"
      - "no"
      - "--save"
      - "60"
      - "1"
      - "--dir"
      - "/data"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Phase 33.1 - Redis Exporter for Prometheus metrics (port 9121)
  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis_exporter
    restart: always
    environment:
      REDIS_ADDR: "redis://cache:6379"
    ports:
      - "9121:9121"
    depends_on:
      - cache
