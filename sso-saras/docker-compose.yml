services:
  postgres:
    image: postgres:16.8
    container_name: sso_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sso_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.5
    container_name: sso_keycloak
    # WARNING: start-dev is a development mode (relaxed hostname/cache/security defaults).
    # Use `start --optimized` with a prebuilt image behind TLS/proxy for production.
    command: start --optimized --http-enabled=true --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_HOSTNAME: sso.s4ras.site
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_SPI_THEME_WELCOME_FORCE_SSL: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Expose /health/live and /health/ready endpoints (disabled by default in Quarkus)
      KC_HEALTH_ENABLED: "true"
      # Persist Keycloak event log expiry: 30 days (2592000 seconds)
      KC_SPI_EVENTS_LISTENER_HH_HEURISTICS_HC_EXPIRATION: "2592000"
    volumes:
      - ./themes/s4ras:/opt/keycloak/themes/s4ras:ro
    ports:
      - "8080:8080"
      - "9000:9000"    # Keycloak management interface: /health/ready /health/live /metrics
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - sso_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: sso_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://keycloak:${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}@postgres:5432/keycloak?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - sso_net

volumes:
  postgres_data:

networks:
  sso_net:
    driver: bridge
