version: "3.8"

services:
  postgres:
    image: bitnami/postgresql:15
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgresql_data:/bitnami/postgresql
    environment:
      - POSTGRESQL_USERNAME=moodleuser
      - POSTGRESQL_PASSWORD=${MOODLE_DB_PASSWORD:?set MOODLE_DB_PASSWORD in .env}
      - POSTGRESQL_DATABASE=moodledb
      - ALLOW_EMPTY_PASSWORD=no
    networks:
      - moodle_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    image: bitnami/moodle:4.5.2
    container_name: moodle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata:/bitnami/moodledata
    environment:
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_HOST=postgres
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_USER=moodleuser
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DB_PASSWORD:?set MOODLE_DB_PASSWORD in .env}
      - MOODLE_DATABASE_NAME=moodledb
      - MOODLE_ENABLE_HTTPS=yes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/lib/ajax/service.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - moodle_net

volumes:
  moodle_data:
  moodledata:
  postgresql_data:

networks:
  moodle_net:
    driver: bridge
