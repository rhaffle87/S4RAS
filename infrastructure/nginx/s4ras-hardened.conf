# ==============================================================================
# S4RAS Cluster — Production Nginx Hardened Configuration Template
# OWASP & Security Compliance Standards (PCI-DSS / ISO 27001 baseline)
# ==============================================================================

# 1. Global Performance & Security Tweaks
server_tokens off;
client_body_buffer_size 128k;
client_max_body_size 50M;

# 2. Modern SSL Hardening
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# 3. Upstream Keep-Alive Pools (Latency Optimization)
upstream portal_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream moodle_backend {
    server 192.168.10.203:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream keycloak_backend {
    server 192.168.10.206:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream nextcloud_backend {
    server 192.168.10.207:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream iptv_backend {
    server 192.168.10.200:8096 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream voip_backend {
    server 192.168.10.202:8088 max_fails=3 fail_timeout=10s;
    server 192.168.10.201:8088 backup;
    keepalive 16;
}

# 4. Global HTTP to HTTPS Redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name s4ras.site *.s4ras.site;
    return 301 https://$host$request_uri;
}

# 5. Core Portal & Microservices Virtual Hosts
server {
    listen 443 ssl http2;
    server_name s4ras.site portal.s4ras.site;

    ssl_certificate /etc/cloudflare/ssl/origin_cert.pem;
    ssl_certificate_key /etc/cloudflare/ssl/origin_key.pem;

    # Mandatory Security Compliance Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    location / {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/announcements/stream {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
